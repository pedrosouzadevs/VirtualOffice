services:
  reverse-proxy:
    image: traefik:v3.6.1
    command:
      - --log.level=${LOG_LEVEL}
      - --providers.docker
      - --providers.docker.exposedbydefault=false
      # Entry points
      - --entryPoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.websecure.address=:443
      - --entryPoints.grpc.address=:50051
      # HTTP challenge
      - --certificatesresolvers.myresolver.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web
      # Let's Encrypt's staging server
      # uncomment during testing to avoid rate limiting
      #- --certificatesresolvers.dnsresolver.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
      - "${GRPC_PORT}:50051"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR}/letsencrypt/:/letsencrypt/
    restart: ${RESTART_POLICY}

  # Built from THIS repository, not pulled from Docker Hub, and that is load-bearing: the upstream images do not
  # contain this fork's changes — F4's area-owner lock in play, and the schemas admin-api validates against. The
  # VERSION variable is the local tag the build produces, not an upstream release.
  play:
    image: virtualoffice/play:${VERSION}
    build:
      context: ../..
      dockerfile: play/Dockerfile
    depends_on:
      # The pusher retries /api/capabilities without a cap BEFORE opening its port, so play must not start until
      # admin-api answers — otherwise a slow admin-api boot looks like a hung play (ADR-0002, Trap #2).
      admin-api:
        condition: service_healthy
    environment:
      - DEBUG_MODE
      - JITSI_URL
      - JITSI_PRIVATE_MODE
      - ENABLE_MAP_EDITOR
      - MAP_EDITOR_ALLOWED_USERS
      - MAP_EDITOR_ALLOW_ALL_USERS
      - PUSHER_URL=https://${DOMAIN}
      - ICON_URL=/icon
      - TURN_SERVER
      - TURN_USER
      - TURN_PASSWORD
      - TURN_STATIC_AUTH_SECRET
      - STUN_SERVER
      - SKIP_RENDER_OPTIMIZATIONS
      - MAX_PER_GROUP
      - MAX_USERNAME_LENGTH
      - DISABLE_ANONYMOUS
      - DISABLE_NOTIFICATIONS
      - SECRET_KEY
      - API_URL=back:50051
      - FRONT_URL=/
      - INTERNAL_MAP_STORAGE_URL=http://map-storage:3000
      - PUBLIC_MAP_STORAGE_URL=https://${DOMAIN}/map-storage
      - START_ROOM_URL
      - OPENID_PROMPT=login
      - OPENID_WOKA_NAME_POLICY
      - OPENID_CLIENT_ID
      - OPENID_CLIENT_SECRET
      - OPENID_CLIENT_ISSUER
      - OPENID_PROFILE_SCREEN_PROVIDER
      - OPENID_SCOPE
      - OPENID_USERNAME_CLAIM
      - OPENID_LOCALE_CLAIM
      - OPENID_LOGOUT_REDIRECT_URL
      - FALLBACK_LOCALE
      - ENABLE_CHAT
      - ENABLE_CHAT_UPLOAD
      - ENABLE_CHAT_ONLINE_LIST
      - ENABLE_CHAT_DISCONNECTED_LIST
      - CLIENT_DISCONNECTION_RETENTION_MS
      - REDIS_HOST=redis
      - ENABLE_TUTORIAL=${ENABLE_TUTORIAL:-true}
      - UPLOADER_URL=/uploader
      # Report issues menu
      - ENABLE_REPORT_ISSUES_MENU=${ENABLE_REPORT_ISSUES_MENU}
      - REPORT_ISSUES_URL=${REPORT_ISSUES_URL}
      - ENABLE_OPENAPI_ENDPOINT=true
      - ADMIN_API_TOKEN
      - ADMIN_API_URL
      - ADMIN_URL
      # Mounts /ws/admin/rooms, the channel a dashboard ban kicks through (ADR-0006). Same value admin-api signs with.
      - ADMIN_SOCKETS_TOKEN
      - ROOM_API_PORT=50051
      - ROOM_API_SECRET_KEY=${ROOM_API_SECRET_KEY}
      - GRPC_VERBOSITY=ERROR
      - GRPC_TRACE=all
      - SENTRY_ORG=${SENTRY_ORG}
      - SENTRY_PROJECT=${SENTRY_PROJECT}
      - SENTRY_DSN_FRONT=${SENTRY_DSN_FRONT}
      - SENTRY_DSN_PUSHER=${SENTRY_DSN_PUSHER}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT}
      - SENTRY_RELEASE=${SENTRY_RELEASE}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE}
      - WOKA_SPEED
      - FEATURE_FLAG_BROADCAST_AREAS=${FEATURE_FLAG_BROADCAST_AREAS}
      # Tools integration
      - KLAXOON_ENABLED=${KLAXOON_ENABLED}
      - KLAXOON_CLIENT_ID=${KLAXOON_CLIENT_ID}
      - YOUTUBE_ENABLED=${YOUTUBE_ENABLED}
      - GOOGLE_DRIVE_ENABLED=${GOOGLE_DRIVE_ENABLED}
      - GOOGLE_DOCS_ENABLED=${GOOGLE_DOCS_ENABLED}
      - GOOGLE_SHEETS_ENABLED=${GOOGLE_SHEETS_ENABLED}
      - GOOGLE_SLIDES_ENABLED=${GOOGLE_SLIDES_ENABLED}
      - ERASER_ENABLED=${ERASER_ENABLED}
      - EXCALIDRAW_ENABLED=${EXCALIDRAW_ENABLED}
      - EXCALIDRAW_DOMAINS=${EXCALIDRAW_DOMAINS}
      - EMBEDDED_DOMAINS_WHITELIST=${EMBEDDED_DOMAINS_WHITELIST}
      - CARDS_ENABLED=${CARDS_ENABLED}
      - TLDRAW_ENABLED=${TLDRAW_ENABLED}
      - MINIMUM_DISTANCE=${MINIMUM_DISTANCE}
      # Google drive picker
      - GOOGLE_DRIVE_PICKER_CLIENT_ID=${GOOGLE_DRIVE_PICKER_CLIENT_ID}
      - GOOGLE_DRIVE_PICKER_APP_ID=${GOOGLE_DRIVE_PICKER_APP_ID}
      - MAP_STORAGE_API_TOKEN=${MAP_STORAGE_API_TOKEN:-${SECRET_KEY}}
      - MATRIX_API_URI
      - MATRIX_PUBLIC_URI
      - MATRIX_ADMIN_USER
      - MATRIX_ADMIN_PASSWORD
      - MATRIX_DOMAIN
      - LIVEKIT_API_KEY
      - LIVEKIT_API_SECRET
      - LIVEKIT_RECORDING_S3_ENDPOINT
      - LIVEKIT_RECORDING_S3_ACCESS_KEY
      - LIVEKIT_RECORDING_S3_SECRET_KEY
      - LIVEKIT_RECORDING_S3_REGION
      - LIVEKIT_RECORDING_S3_BUCKET
      - LIVEKIT_RECORDING_S3_CDN_ENDPOINT
      - LIVEKIT_PIXEL_DENSITY=${LIVEKIT_PIXEL_DENSITY:-}
      - MAX_DISPLAYED_VIDEOS
    labels:
      traefik.enable: "true"

      traefik.http.routers.play.rule: "Host(`${DOMAIN}`) && PathPrefix(`/`)"
      traefik.http.routers.play.entryPoints: "web"
      traefik.http.routers.play.service: play
      traefik.http.services.play.loadbalancer.server.port: "3000"

      traefik.http.routers.play-ssl.rule: "Host(`${DOMAIN}`) && PathPrefix(`/`)"
      traefik.http.routers.play-ssl.entryPoints: "websecure"
      traefik.http.routers.play-ssl.tls: "true"
      traefik.http.routers.play-ssl.tls.certresolver: "myresolver"
      traefik.http.routers.play-ssl.service: "play"

      traefik.http.routers.play-ws.rule: "Host(`${DOMAIN}`) && PathPrefix(`/ws/`)"
      traefik.http.routers.play-ws.entryPoints: "web"
      traefik.http.routers.play-ws.service: play-ws
      traefik.http.services.play-ws.loadbalancer.server.port: "3001"
      traefik.http.services.play-ws.loadbalancer.sticky.cookie: "true"
      traefik.http.services.play-ws.loadbalancer.sticky.cookie.name: "wa_ws_affinity"
      traefik.http.services.play-ws.loadbalancer.sticky.cookie.httpOnly: "true"
      traefik.http.services.play-ws.loadbalancer.sticky.cookie.sameSite: "lax"

      traefik.http.routers.play-ws-ssl.rule: "Host(`${DOMAIN}`) && PathPrefix(`/ws/`)"
      traefik.http.routers.play-ws-ssl.entryPoints: "websecure"
      traefik.http.routers.play-ws-ssl.tls: "true"
      traefik.http.routers.play-ws-ssl.tls.certresolver: "myresolver"
      traefik.http.routers.play-ws-ssl.service: "play-ws"

      traefik.http.routers.room-api.rule: "Host(`${DOMAIN}`)"
      traefik.http.routers.room-api.entryPoints: "grpc"
      traefik.http.routers.room-api.service: "room-api"
      traefik.http.services.room-api.loadbalancer.server.port: "50051"
      traefik.http.services.room-api.loadbalancer.server.scheme: "h2c"
      traefik.http.routers.room-api.tls: "true"
      traefik.http.routers.room-api.tls.certresolver: "myresolver"
    restart: ${RESTART_POLICY}

  back:
    image: virtualoffice/back:${VERSION}
    build:
      context: ../..
      dockerfile: back/Dockerfile
    environment:
      - PLAY_URL=https://${DOMAIN}
      - MINIMUM_DISTANCE=${MINIMUM_DISTANCE}
      - GROUP_RADIUS=${GROUP_RADIUS}
      - SECRET_JITSI_KEY
      - ENABLE_MAP_EDITOR
      - SECRET_KEY
      - ADMIN_API_TOKEN
      - ADMIN_API_URL
      - TURN_SERVER
      - TURN_USER
      - TURN_PASSWORD
      - STUN_SERVER
      - JITSI_URL
      - JITSI_ISS
      - BBB_URL
      - BBB_SECRET
      - MAX_PER_GROUP
      - STORE_VARIABLES_FOR_LOCAL_MAPS
      - REDIS_HOST=redis
      - PROMETHEUS_AUTHORIZATION_TOKEN
      - MAP_STORAGE_URL=map-storage:50053
      - INTERNAL_MAP_STORAGE_URL=http://map-storage:3000
      - PUBLIC_MAP_STORAGE_URL=https://${DOMAIN}/map-storage
      - PLAYER_VARIABLES_MAX_TTL
      - ENABLE_CHAT
      - ENABLE_CHAT_UPLOAD
      - SENTRY_DSN=${SENTRY_DSN_BACK}
      - SENTRY_RELEASE
      - SENTRY_TRACES_SAMPLE_RATE
      - MAX_USERS_FOR_WEBRTC
      - LIVEKIT_HOST
      - LIVEKIT_API_KEY
      - LIVEKIT_API_SECRET
      - LIVEKIT_RECORDING_S3_ENDPOINT
      - LIVEKIT_RECORDING_S3_ACCESS_KEY
      - LIVEKIT_RECORDING_S3_SECRET_KEY
      - LIVEKIT_RECORDING_S3_REGION
      - LIVEKIT_RECORDING_S3_BUCKET
      - LIVEKIT_RECORDING_S3_CDN_ENDPOINT
    labels:
      traefik.enable: "true"
      traefik.http.middlewares.strip-api-prefix.stripprefix.prefixes: "/api"
      traefik.http.routers.back.rule: "Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      traefik.http.routers.back.middlewares: "strip-api-prefix@docker"
      traefik.http.routers.back.entryPoints: "web"
      traefik.http.services.back.loadbalancer.server.port: "8080"
      traefik.http.routers.back-ssl.middlewares: "strip-api-prefix@docker"
      traefik.http.routers.back-ssl.rule: "Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      traefik.http.routers.back-ssl.entryPoints: "websecure"
      traefik.http.routers.back-ssl.service: "back"
      traefik.http.routers.back-ssl.tls: "true"
      traefik.http.routers.back-ssl.tls.certresolver: "myresolver"
    restart: ${RESTART_POLICY}

  uploader:
    image: virtualoffice/uploader:${VERSION}
    build:
      context: ../..
      dockerfile: uploader/Dockerfile
    environment:
      - UPLOADER_URL=https://${DOMAIN}/uploader
      #AWS
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - AWS_BUCKET=${AWS_BUCKET}
      - AWS_URL=${AWS_URL}
      - AWS_ENDPOINT=${AWS_ENDPOINT}
      #REDIS
      - REDIS_HOST=${UPLOADER_REDIS_HOST}
      - REDIS_PORT=${UPLOADER_REDIS_PORT}
      #CHAT
      - ADMIN_API_URL=${ADMIN_API_URL}
      - ENABLE_CHAT_UPLOAD=${ENABLE_CHAT_UPLOAD}
      - UPLOAD_MAX_FILESIZE=${UPLOAD_MAX_FILESIZE}
    labels:
      traefik.enable: "true"
      traefik.http.middlewares.strip-uploader-prefix.stripprefix.prefixes: "/uploader"
      traefik.http.routers.uploader.rule: "Host(`${DOMAIN}`) && PathPrefix(`/uploader`)"
      traefik.http.routers.uploader.middlewares: "strip-uploader-prefix@docker"
      traefik.http.routers.uploader.entryPoints: "web"
      traefik.http.services.uploader.loadbalancer.server.port: "8080"
      traefik.http.routers.uploader-ssl.middlewares: "strip-uploader-prefix@docker"
      traefik.http.routers.uploader-ssl.rule: "Host(`${DOMAIN}`) && PathPrefix(`/uploader`)"
      traefik.http.routers.uploader-ssl.entryPoints: "websecure"
      traefik.http.routers.uploader-ssl.service: "uploader"
      traefik.http.routers.uploader-ssl.tls: "true"
      traefik.http.routers.uploader-ssl.tls.certresolver: "myresolver"
    restart: ${RESTART_POLICY}

  icon:
    image: matthiasluedtke/iconserver:v3.21.0
    labels:
      traefik.enable: "true"
      traefik.http.middlewares.strip-icon-prefix.stripprefix.prefixes: "/icon"
      traefik.http.routers.icon.middlewares: "strip-icon-prefix@docker"
      traefik.http.routers.icon.rule: "Host(`${DOMAIN}`) && PathPrefix(`/icon`)"
      traefik.http.routers.icon.entryPoints: "web"
      traefik.http.services.icon.loadbalancer.server.port: "8080"
      traefik.http.routers.icon-ssl.middlewares: "strip-icon-prefix@docker"
      traefik.http.routers.icon-ssl.rule: "Host(`${DOMAIN}`) && PathPrefix(`/icon`)"
      traefik.http.routers.icon-ssl.entryPoints: "websecure"
      traefik.http.routers.icon-ssl.service: "icon"
      traefik.http.routers.icon-ssl.tls: "true"
      traefik.http.routers.icon-ssl.tls.certresolver: "myresolver"
      # Route for /lettericons (redirect target from iconserver)
      traefik.http.routers.lettericons.rule: "Host(`${DOMAIN}`) && PathPrefix(`/lettericons`)"
      traefik.http.routers.lettericons.entryPoints: "web"
      traefik.http.routers.lettericons.service: "icon"
      traefik.http.routers.lettericons-ssl.rule: "Host(`${DOMAIN}`) && PathPrefix(`/lettericons`)"
      traefik.http.routers.lettericons-ssl.entryPoints: "websecure"
      traefik.http.routers.lettericons-ssl.service: "icon"
      traefik.http.routers.lettericons-ssl.tls: "true"
      traefik.http.routers.lettericons-ssl.tls.certresolver: "myresolver"
    restart: ${RESTART_POLICY}

  redis:
    image: redis:6
    volumes:
      - redisdata:/data
    restart: ${RESTART_POLICY}

  admin-api-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: "${ADMIN_API_DB_USER:-admin_api}"
      POSTGRES_PASSWORD: "${ADMIN_API_DB_PASSWORD:?set ADMIN_API_DB_PASSWORD in .env}"
      POSTGRES_DB: "${ADMIN_API_DB_NAME:-admin_api}"
    volumes:
      - admin-api-db-data:/var/lib/postgresql/data
    healthcheck:
      # Without this, admin-api races the database on a cold start and dies applying migrations.
      test: ["CMD-SHELL", "pg_isready -U ${ADMIN_API_DB_USER:-admin_api} -d ${ADMIN_API_DB_NAME:-admin_api}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: ${RESTART_POLICY}

  # ArqueumSpace Admin API (ADR-0002..0006): identity, tags, permissions, moderation, and the dashboard.
  # /api/* is deliberately NOT routed by Traefik — only the pusher calls it, in-network at http://admin-api:3000.
  # The dashboard at /admin/* is the one public surface, on the same domain and certificate as everything else.
  admin-api:
    image: virtualoffice/admin-api:${VERSION}
    build:
      context: ../..
      dockerfile: admin-api/Dockerfile
    depends_on:
      admin-api-db:
        condition: service_healthy
    environment:
      ADMIN_API_PORT: "3000"
      ADMIN_API_TOKEN: "${ADMIN_API_TOKEN:?set ADMIN_API_TOKEN in .env}"
      ADMIN_API_DATABASE_URL: "postgres://${ADMIN_API_DB_USER:-admin_api}:${ADMIN_API_DB_PASSWORD}@admin-api-db:5432/${ADMIN_API_DB_NAME:-admin_api}"
      # Granted the admin tag by the idempotent bootstrap on every startup. Set it to a real address — with Entra ID
      # this is the email of whoever administers the world, and it is also the lockout recovery (restart re-grants).
      ADMIN_API_BOOTSTRAP_ADMIN_EMAIL: "${ADMIN_API_BOOTSTRAP_ADMIN_EMAIL}"
      # The dashboard lives on the main domain under /admin — one DNS record, one certificate.
      ADMIN_API_PUBLIC_URL: "https://${DOMAIN}"
      ADMIN_API_SESSION_SECRET: "${ADMIN_API_SESSION_SECRET:?set ADMIN_API_SESSION_SECRET in .env}"
      # Traefik terminates TLS in front of us, one hop away.
      ADMIN_API_TRUST_PROXY: "1"
      ADMIN_API_WORLD_NAME: "${ADMIN_API_WORLD_NAME:-ArqueumSpace}"
      ADMIN_API_ALERT_WEBHOOK_URL: "${ADMIN_API_ALERT_WEBHOOK_URL:-}"
      # The same OIDC client play uses, from the same values: pointing the world at Entra ID points the dashboard
      # there in the same motion (F2). The scope is fixed — the dashboard needs the email and nothing else.
      OPENID_CLIENT_ID: "${OPENID_CLIENT_ID}"
      OPENID_CLIENT_SECRET: "${OPENID_CLIENT_SECRET}"
      OPENID_CLIENT_ISSUER: "${OPENID_CLIENT_ISSUER}"
      OPENID_SCOPE: "openid email profile"
      # The kick channel (ADR-0006): the pusher's /ws/admin/rooms websocket. 3001 is the pusher's websocket app —
      # the same split the play-ws Traefik router encodes; 3000 is its HTTP app and has no /ws routes.
      ADMIN_SOCKETS_TOKEN: "${ADMIN_SOCKETS_TOKEN:?set ADMIN_SOCKETS_TOKEN in .env}"
      PLAY_URL: "https://${DOMAIN}"
      INTERNAL_PLAY_URL: "http://play:3001"
      # The room catalogue (dashboard G3, /api/room/sameWorld, and the kick's room list).
      INTERNAL_MAP_STORAGE_URL: "http://map-storage:3000"
      PUBLIC_MAP_STORAGE_URL: "https://${DOMAIN}/map-storage"
      # Everything below also feeds play. Once ADMIN_API_URL is set, /api/map is built from THESE values and play's
      # copies stop applying to those fields — both services read the same .env so they cannot drift (ADR-0002).
      START_ROOM_URL: "${START_ROOM_URL}"
      DISABLE_ANONYMOUS: "${DISABLE_ANONYMOUS:-true}"
      ENABLE_MAP_EDITOR: "${ENABLE_MAP_EDITOR:-true}"
      ENABLE_CHAT: "${ENABLE_CHAT:-true}"
      ENABLE_CHAT_UPLOAD: "${ENABLE_CHAT_UPLOAD:-true}"
      ENABLE_CHAT_ONLINE_LIST: "${ENABLE_CHAT_ONLINE_LIST:-true}"
      ENABLE_CHAT_DISCONNECTED_LIST: "${ENABLE_CHAT_DISCONNECTED_LIST:-true}"
      ENABLE_SAY: "${ENABLE_SAY:-true}"
      ENABLE_ISSUE_REPORT: "${ENABLE_ISSUE_REPORT:-false}"
      ENABLE_TUTORIAL: "${ENABLE_TUTORIAL:-true}"
      SKIP_CAMERA_PAGE: "${SKIP_CAMERA_PAGE:-false}"
      BYPASS_PWA: "${BYPASS_PWA:-false}"
      DEFAULT_WOKA_NAME: "${DEFAULT_WOKA_NAME:-}"
      DEFAULT_WOKA_TEXTURE: "${DEFAULT_WOKA_TEXTURE:-}"
      PROVIDE_DEFAULT_WOKA_NAME: "${PROVIDE_DEFAULT_WOKA_NAME:-no}"
      PROVIDE_DEFAULT_WOKA_TEXTURE: "${PROVIDE_DEFAULT_WOKA_TEXTURE:-no}"
      OPID_WOKA_NAME_POLICY: "${OPID_WOKA_NAME_POLICY:-allow_override_opid}"
      MATRIX_PUBLIC_URI: "${MATRIX_PUBLIC_URI:-}"
      MATRIX_API_URI: "${MATRIX_API_URI:-}"
      MATRIX_ADMIN_USER: "${MATRIX_ADMIN_USER:-}"
      MATRIX_ADMIN_PASSWORD: "${MATRIX_ADMIN_PASSWORD:-}"
      MATRIX_DOMAIN: "${MATRIX_DOMAIN:-}"
      KLAXOON_ENABLED: "${KLAXOON_ENABLED:-false}"
      YOUTUBE_ENABLED: "${YOUTUBE_ENABLED:-true}"
      GOOGLE_DRIVE_ENABLED: "${GOOGLE_DRIVE_ENABLED:-false}"
      GOOGLE_DOCS_ENABLED: "${GOOGLE_DOCS_ENABLED:-false}"
      GOOGLE_SHEETS_ENABLED: "${GOOGLE_SHEETS_ENABLED:-false}"
      GOOGLE_SLIDES_ENABLED: "${GOOGLE_SLIDES_ENABLED:-false}"
      ERASER_ENABLED: "${ERASER_ENABLED:-false}"
      EXCALIDRAW_ENABLED: "${EXCALIDRAW_ENABLED:-false}"
      CARDS_ENABLED: "${CARDS_ENABLED:-false}"
      TLDRAW_ENABLED: "${TLDRAW_ENABLED:-false}"
      LIVEKIT_RECORDING_S3_ENDPOINT: "${LIVEKIT_RECORDING_S3_ENDPOINT:-}"
      LIVEKIT_RECORDING_S3_ACCESS_KEY: "${LIVEKIT_RECORDING_S3_ACCESS_KEY:-}"
      LIVEKIT_RECORDING_S3_SECRET_KEY: "${LIVEKIT_RECORDING_S3_SECRET_KEY:-}"
      LIVEKIT_RECORDING_S3_REGION: "${LIVEKIT_RECORDING_S3_REGION:-}"
      LIVEKIT_RECORDING_S3_BUCKET: "${LIVEKIT_RECORDING_S3_BUCKET:-}"
    healthcheck:
      # /healthz, not /readyz: liveness gates play's startup ordering; a Postgres blip mid-flight must not make
      # compose restart-cascade the world.
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    labels:
      traefik.enable: "true"
      # No strip-prefix: the application's own routes start at /admin. /api stays unrouted on purpose — on this
      # domain /api belongs to back, and admin-api's /api is for the pusher, in-network only.
      traefik.http.routers.admin-api.rule: "Host(`${DOMAIN}`) && PathPrefix(`/admin`)"
      traefik.http.routers.admin-api.entryPoints: "web"
      traefik.http.routers.admin-api.service: "admin-api"
      traefik.http.services.admin-api.loadbalancer.server.port: "3000"
      traefik.http.routers.admin-api-ssl.rule: "Host(`${DOMAIN}`) && PathPrefix(`/admin`)"
      traefik.http.routers.admin-api-ssl.entryPoints: "websecure"
      traefik.http.routers.admin-api-ssl.service: "admin-api"
      traefik.http.routers.admin-api-ssl.tls: "true"
      traefik.http.routers.admin-api-ssl.tls.certresolver: "myresolver"
    restart: ${RESTART_POLICY}

  map-storage:
    image: virtualoffice/map-storage:${VERSION}
    build:
      context: ../..
      dockerfile: map-storage/Dockerfile
    environment:
      API_URL: back:50051
      PROMETHEUS_AUTHORIZATION_TOKEN: "$PROMETHEUS_AUTHORIZATION_TOKEN"
      AUTHENTICATION_STRATEGY: "$MAP_STORAGE_AUTHENTICATION_STRATEGY"
      ENABLE_BEARER_AUTHENTICATION: "$MAP_STORAGE_ENABLE_BEARER_AUTHENTICATION"
      ENABLE_BASIC_AUTHENTICATION: "$MAP_STORAGE_ENABLE_BASIC_AUTHENTICATION"
      ENABLE_DIGEST_AUTHENTICATION: "$MAP_STORAGE_ENABLE_DIGEST_AUTHENTICATION"
      AUTHENTICATION_USER: "$MAP_STORAGE_AUTHENTICATION_USER"
      AUTHENTICATION_PASSWORD: "$MAP_STORAGE_AUTHENTICATION_PASSWORD"
      AUTHENTICATION_TOKEN: "$MAP_STORAGE_AUTHENTICATION_TOKEN"
      AUTHENTICATION_VALIDATOR_URL: "$MAP_STORAGE_AUTHENTICATION_VALIDATOR_URL"
      SENTRY_DSN: $SENTRY_DSN_MAPSTORAGE
      SENTRY_RELEASE: $SENTRY_RELEASE
      SENTRY_ENVIRONMENT: $SENTRY_ENVIRONMENT
      SENTRY_TRACES_SAMPLE_RATE: $SENTRY_TRACES_SAMPLE_RATE
      SECRET_KEY: $SECRET_KEY
      PATH_PREFIX: "/map-storage"
      ENTITY_COLLECTION_URLS: "https://${DOMAIN}/collections/FurnitureCollection.json,https://${DOMAIN}/collections/OfficeCollection.json"
      MAP_STORAGE_API_TOKEN: "${MAP_STORAGE_API_TOKEN:-${SECRET_KEY}}"
      PUSHER_URL: "https://${DOMAIN}"
    volumes:
      - map-storage-data:/maps
    labels:
      traefik.enable: "true"
      traefik.http.middlewares.strip-map-storage-prefix.stripprefix.prefixes: "/map-storage"
      traefik.http.routers.map-storage.middlewares: "strip-map-storage-prefix@docker"
      traefik.http.routers.map-storage.rule: "Host(`${DOMAIN}`) && PathPrefix(`/map-storage`)"
      traefik.http.routers.map-storage.entryPoints: "web"
      traefik.http.services.map-storage.loadbalancer.server.port: "3000"
      traefik.http.routers.map-storage-ssl.middlewares: "strip-map-storage-prefix@docker"
      traefik.http.routers.map-storage-ssl.rule: "Host(`${DOMAIN}`) && PathPrefix(`/map-storage`)"
      traefik.http.routers.map-storage-ssl.entryPoints: "websecure"
      traefik.http.routers.map-storage-ssl.service: "map-storage"
      traefik.http.routers.map-storage-ssl.tls: "true"
      traefik.http.routers.map-storage-ssl.tls.certresolver: "myresolver"
    restart: ${RESTART_POLICY}

volumes:
  redisdata:
  map-storage-data:
  admin-api-db-data:
